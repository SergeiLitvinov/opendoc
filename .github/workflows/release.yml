name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "current, patch, minor, major or MAJOR.MINOR.PATCH"
        default: current
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          SELECTOR: ${{ inputs.version || 'current' }}
        run: |
          VERSION=$(python -m tools.release plan "$SELECTOR")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            if git show-ref --verify --quiet "refs/tags/v$VERSION" && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
              echo "Version v$VERSION already has a tag; rerun its release workflow instead."
              exit 1
            fi
          else
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ needs.plan.outputs.version }}
  publish:
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: python -m tools.release set "$RELEASE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: .opendoc/release-dist
      - run: python -m tools.release assets
      - name: Commit and tag verified version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          TAG="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            git diff --exit-code "$TAG" -- .
            git merge-base --is-ancestor "$GITHUB_SHA" "$TAG^{commit}"
            git merge-base --is-ancestor "$TAG^{commit}" origin/main
          else
            if ! git diff --quiet -- src/opendoc_model/__init__.py; then
              git add src/opendoc_model/__init__.py
              git commit -m "Release $TAG"
            fi
            git tag -a "$TAG" -m "OpenDoc Model $RELEASE_VERSION"
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi
      - name: Publish verified assets
        run: |
          TAG="v$RELEASE_VERSION"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "OpenDoc Model $RELEASE_VERSION" --generate-notes
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" .opendoc/release-dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
  pages:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
