name: OpenDoc checks
on: [push, pull_request]
jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run python -m tools.docs check
      - run: uv build --out-dir dist
      - run: |
          uv venv --python "${{ matrix.python-version }}" .opendoc/wheel-env
          uv pip install --python .opendoc/wheel-env/bin/python --no-deps --no-index dist/*.whl
          uv run python -m tools.check_wheel --python .opendoc/wheel-env/bin/python
          uv run python -m tools.check_types --python .opendoc/wheel-env/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: opendoc-docs-${{ matrix.python-version }}
          path: .opendoc/docs-site
          include-hidden-files: true
