[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendoc"
dynamic = ["version"]
description = "Independent document structures, serialization and structural comparison"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
math = ["lxml>=5.0.0"]
dev = [
    "mypy>=2.4,<3",
    "pytest>=8.0",
    "ruff>=0.9.0",
    "types-lxml>=2026.2.16",
]
docs = ["mkdocs>=1.6,<2"]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["build", ".venv", ".opendoc"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "BLE", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"tools/**" = ["ANN"]
"examples/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
files = ["src/opendoc"]
strict = true
cache_dir = ".opendoc/mypy-cache"
show_error_codes = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "opendoc.__version__"}

[tool.setuptools.package-data]
opendoc = ["py.typed"]
